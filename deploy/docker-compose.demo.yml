services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      FASTAPI_ENV: demo
      PROJECT_NAME: ${PROJECT_NAME:-AICTE FDR Portal (DEMO)}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD must be set}
    command: >
      sh -c "alembic upgrade head && python -m app.initial_data"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: demo
      PROJECT_NAME: ${PROJECT_NAME:-AICTE FDR Portal (DEMO)}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be set}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD must be set}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-noreply@fdr.aicte-india.org}
    volumes:
      - demo-vault-data:/app/backend/vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  demo-db-data:
  demo-vault-data:
  caddy-data:
  caddy-config:

