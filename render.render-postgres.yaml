# Render-Postgres Blueprint Variant
# Use this configuration ONLY if choosing Render-managed PostgreSQL (0.1c-256mb $7/mo or free 30-day).
# For Neon PostgreSQL (default high-assurance setup), use render.yaml.

services:
  - type: web
    name: aicte-fdr-portal
    runtime: docker
    plan: starter # Starter plan or higher required for persistent disks on Render
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: false # Manual deploy trigger only; protects live demo environment
    healthCheckPath: /health # Lightweight liveness check; avoids DB churn on ping
    disk:
      name: fdr-vault-disk
      mountPath: /app/backend/vault
      sizeGB: 1
    envVars:
      - key: FASTAPI_ENV
        value: demo # Set to 'production' for strict regulatory production mode
      - key: PROJECT_NAME
        value: AICTE Security Deposit Portal
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: VAULT_PATH
        value: /app/backend/vault
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render edge reverse proxy hop count
      - key: SECRET_KEY
        sync: false # Set manually in Render Dashboard (minimum 32 characters)
      - key: VAULT_KEY
        sync: false # Set manually in Render Dashboard (AES-256-GCM 32-byte key)
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-fdr-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false # Set manually if Supabase cloud storage is enabled
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set manually if Supabase cloud storage is enabled
      - key: SUPABASE_STORAGE_BUCKET
        value: fdr-vault
      - key: FIRST_SUPERUSER
        value: admin@example.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false # Set manually in Render Dashboard
      - key: AUTO_SEED
        value: "true"
      - key: FRONTEND_HOST
        sync: false # Set to your deployed URL: https://<service-name>.onrender.com

databases:
  # Render PostgreSQL Database specification (cite: https://render.com/docs/blueprint-spec#databases & https://render.com/docs/database-plans)
  # Plan ID options: 0.1c-256mb (legacy: basic-256mb; $7/mo persistent), free (expires in 30 days)
  - name: aicte-fdr-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: app
    user: app
    postgresMajorVersion: "16"
