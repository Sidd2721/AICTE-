services:
  - type: web
    name: aicte-fdr-portal
    runtime: docker
    plan: starter # Starter plan or higher required for persistent disks on Render
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: false # Manual deploy trigger only; protects live demo environment
    healthCheckPath: /health # Lightweight liveness check; avoids DB churn on ping
    disk:
      name: fdr-vault-disk
      mountPath: /app/backend/vault
      sizeGB: 10
    envVars:
      - key: FASTAPI_ENV
        value: demo # Set to 'production' for strict regulatory production mode
      - key: PROJECT_NAME
        value: AICTE Security Deposit Portal
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: VAULT_PATH
        value: /app/backend/vault
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render edge reverse proxy hop count
      - key: SECRET_KEY
        sync: false # Set manually in Render Dashboard (minimum 32 characters)
      - key: VAULT_KEY
        sync: false # Set manually in Render Dashboard (AES-256-GCM 32-byte key)
      - key: DATABASE_URL
        sync: false # Set manually in Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set manually if Supabase cloud storage is enabled
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set manually if Supabase cloud storage is enabled
      - key: SUPABASE_STORAGE_BUCKET
        value: fdr-vault
      - key: FIRST_SUPERUSER
        value: admin@example.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false # Set manually in Render Dashboard
      - key: AUTO_SEED
        value: "true"
      - key: FRONTEND_HOST
        sync: false # Set to your deployed URL: https://<service-name>.onrender.com
