services:
  - type: web
    name: aicte-fdr-portal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FASTAPI_ENV
        value: demo # Set to 'production' for strict production enforcement
      - key: PROJECT_NAME
        value: AICTE Security Deposit Portal
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a 256-bit secure key
      - key: VAULT_KEY
        generateValue: true # Render automatically generates a 256-bit secure key
      - key: DATABASE_URL
        sync: false # Supabase session pooler (Port 5432): postgresql://postgres.<ref>:<pw>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: SUPABASE_URL
        sync: false # Supabase Project URL: https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase service_role key
      - key: SUPABASE_STORAGE_BUCKET
        value: fdr-vault
      - key: FIRST_SUPERUSER
        value: admin@example.com
      - key: FIRST_SUPERUSER_PASSWORD
        value: AdminSecure2026!
      - key: AUTO_SEED
        value: "true"
      - key: FRONTEND_HOST
        sync: false # Once deployed, set to your https://<app-name>.onrender.com
