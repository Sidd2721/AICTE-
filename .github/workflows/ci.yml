name: CI - Full Gate Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets & Path Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env is tracked in git!"
            exit 1
          fi

      - name: Check for absolute file URLs or local paths in docs
        run: |
          HYGIENE_PATTERN="file:"'///|C:\'"\Users|/Users/[a-z]+/|ava"'du'
          if git grep -nE "$HYGIENE_PATTERN" -- . ':!*.lock' ':!.gemini/*'; then
            echo "ERROR: Found absolute file URLs or personal path leaks!"
            exit 1
          fi

      - name: Check for raw private keys in tracked code
        run: |
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )PRIVATE KEY' -- . ':!backend/tests/*'; then
            echo "ERROR: Found private key in repository outside test fixtures!"
            exit 1
          fi

  full-gate:
    name: Lint, Types, Tests & Build Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Database Roles & Least Privilege
        run: |
          export PGPASSWORD=testpassword
          # Create migrator and app roles
          psql -h localhost -U postgres -d app -f scripts/roles.sql
          psql -h localhost -U postgres -d app -c "ALTER ROLE migrator WITH PASSWORD 'migratorpassword'; ALTER ROLE app WITH PASSWORD 'apppassword';"
          # In PostgreSQL 16+, public schema permissions are restricted; grant migrator rights to migrate
          psql -h localhost -U postgres -d app -c "GRANT ALL ON SCHEMA public TO migrator; GRANT ALL ON DATABASE app TO migrator; ALTER SCHEMA public OWNER TO migrator;"
          # Create app_test database for isolated pytest runs
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE app_test OWNER migrator;"
          psql -h localhost -U postgres -d postgres -c "GRANT CONNECT ON DATABASE app_test TO app;"
          psql -h localhost -U postgres -d app_test -c "GRANT ALL ON SCHEMA public TO migrator; GRANT ALL ON DATABASE app_test TO migrator; ALTER SCHEMA public OWNER TO migrator;"
          psql -h localhost -U postgres -d app_test -c "GRANT ALL ON SCHEMA public TO app; GRANT ALL ON DATABASE app_test TO app; GRANT DELETE ON ALL TABLES IN SCHEMA public TO app; ALTER DEFAULT PRIVILEGES FOR ROLE migrator IN SCHEMA public GRANT DELETE ON TABLES TO app;"
          # Verify app role is NOSUPERUSER NOBYPASSRLS
          psql -h localhost -U postgres -d app -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('migrator', 'app');"

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Run Backend Prestart & Migrations (as Migrator Role)
        env:
          DATABASE_URL: postgresql+psycopg://app:apppassword@localhost:5432/app
          MIGRATION_DATABASE_URL: postgresql+psycopg://migrator:migratorpassword@localhost:5432/app
          SECRET_KEY: testsecretkeyformodernsecurityinvariants32bytes
          PROJECT_NAME: AICTE Security Deposit Portal
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: changethis
          FASTAPI_ENV: development
        run: |
          cd backend
          uv run alembic upgrade head
          MIGRATION_DATABASE_URL=postgresql+psycopg://migrator:migratorpassword@localhost:5432/app_test uv run alembic upgrade head
          uv run python app/initial_data.py

      - name: Verify Environment Contract
        run: |
          uv run python scripts/print_env_contract.py backend/app

      - name: Run Full Gate (verify.sh)
        env:
          DATABASE_URL: postgresql+psycopg://app:apppassword@localhost:5432/app
          MIGRATION_DATABASE_URL: postgresql+psycopg://migrator:migratorpassword@localhost:5432/app
          MIGRATION_PG_URL: host=localhost port=5432 dbname=app_test user=migrator password=migratorpassword
          APP_PG_URL: host=localhost port=5432 dbname=app_test user=app password=apppassword
          SUPERUSER_PG_URL: host=localhost port=5432 dbname=app_test user=postgres password=testpassword
          POSTGRES_PASSWORD: testpassword
          SECRET_KEY: testsecretkeyformodernsecurityinvariants32bytes
          PROJECT_NAME: AICTE Security Deposit Portal
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: changethis
          FASTAPI_ENV: development
          EMAILS_FROM_EMAIL: info@example.com
        run: |
          bash scripts/verify.sh
